name: Release Extension
run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - extension/manifest.json
      - RELEASE_NOTES.md
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package into its draft release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  upload-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node.js dependencies
        run: npm ci

      - name: Prepare version for a main branch release
        if: github.event_name == 'push' && github.ref_type == 'branch'
        run: |
          version=$(node -p 'JSON.parse(require("fs").readFileSync("extension/manifest.json", "utf8")).version')
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already exists; bump the version for a new release."
            exit 1
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate tag and manifest version
        run: npm run release:validate -- "$RELEASE_TAG"

      - name: Run tests
        run: npm test

      - name: Zip extension folder
        run: zip -r -X extension.zip extension/

      - name: Verify release archive
        run: unzip -t extension.zip

      - name: Create and verify the version tag after checks
        if: github.event_name == 'push' && github.ref_type == 'branch'
        run: |
          if ! git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git tag "$RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          if [ "$(git rev-list -n 1 "$RELEASE_TAG")" != "$(git rev-parse HEAD)" ]; then
            echo "$RELEASE_TAG points to a different commit; do not overwrite it."
            exit 1
          fi

      - name: Publish or update the extension archive
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" extension.zip --clobber
          else
            gh release create "$RELEASE_TAG" extension.zip \
              --verify-tag --title "$RELEASE_TAG" --notes-file RELEASE_NOTES.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
